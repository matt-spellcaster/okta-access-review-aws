[project]
name = "okta-access-review-aws"
version = "0.1.0"
description = "Okta user access review on AWS, approved in Slack, remediated through Jira Service Management"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pyjwt[crypto]>=2.9",
    "reportlab>=5.0.1",
    "boto3>=1.40",
]

[project.scripts]
access-review = "access_review.cli:main"

[dependency-groups]
dev = [
    "pypdf>=6.18.1",
    "pypdfium2>=5.13.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/access_review"]

[tool.uv]
# Ignore packages published after this date so a new upstream release can't
# change what gets installed without a reviewed commit. Bump deliberately.
exclude-newer = "2026-09-16T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
