# Slack app for the access review. Create it at https://api.slack.com/apps
# ("From a manifest") and paste this in as it is.
#
# Interactivity (the Keep / Revoke / Approve buttons) starts OFF: Slack only accepts
# a real https:// Request URL, and that URL exists only after the first deploy.
# Then turn it on under Interactivity & Shortcuts, with the Terraform output
# `slack_request_url` as the Request URL (docs/aws.md, step 6).
display_information:
  name: Access Review
  description: Quarterly Okta access review and sign-off
  background_color: "#0b2545"
features:
  bot_user:
    display_name: Access Review
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write     # post in the review channel and DMs, update review messages
      - im:write       # open DMs with the admin and the CISO
      - files:write    # the report PDF, in the CISO's DM only
settings:
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
