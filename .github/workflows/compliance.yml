# Change-management and vulnerability controls for this repository.
# Each job runs one check, records the result as JSON evidence, and fails if the
# check fails. The evidence job bundles all evidence with SHA-256 hashes and, on
# master, signs the bundle with a GitHub artifact attestation (Sigstore).
# On master, the deploy job then builds the Lambda image and applies Terraform
# (docs/aws.md), behind the protected "production" environment.
name: Compliance

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1" # weekly, so new CVEs and rule changes are caught without a commit
  workflow_dispatch:

permissions: {} # every job asks for exactly what it needs

concurrency:
  group: compliance-${{ github.ref }}
  # Never cancel a master run: it may be in the middle of a Terraform apply.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.15"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # linux_x64 tarball
  PIP_AUDIT_VERSION: "2.10.1"
  ZIZMOR_VERSION: "1.30.1"
  TERRAFORM_VERSION: "1.16.2"
  TERRAFORM_SHA256_AMD64: "0d17011f0c4664539b164b044903d04e296c86c13cb9f28040076c65cfb3985a"
  TERRAFORM_SHA256_ARM64: "c040bd1e3122b4290f70f74288d8c5a54ddd4254a3e52a29e7cc666653f50a0a"
  TFLINT_VERSION: "0.64.0"
  TFLINT_SHA256: "cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537" # linux_amd64 zip
  CHECKOV_VERSION: "3.3.16"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Run tests and the demo review
        run: |
          mkdir -p results
          set +e
          uv run --frozen pytest -q --junitxml=results/tests-junit.xml
          code=$?
          # The demo review doubles as a smoke test; its report is kept as evidence.
          uv run --frozen access-review --snapshot fixtures/demo_snapshot.json \
            --roster fixtures/demo_roster.csv --config fixtures/demo_config.json \
            --as-of 2026-09-15 --out results/demo-review --no-email --no-slack
          demo=$?
          [ "$code" -eq 0 ] && code=$demo
          passed=$(grep -o 'tests="[0-9]*"' results/tests-junit.xml | head -1 | tr -dc 0-9)
          python3 scripts/ci/record.py tests "$code" --title "Tests" \
            --control "SOC 2 CC8.1" --control "ISO 27001 A.8.29" \
            --tool "pytest (uv ${UV_VERSION})" \
            --detail "${passed:-0} tests, including the demo review and sample-report freshness"
          exit "$code"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: result-tests
          path: results/
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just this commit
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
      - name: Scan git history for secrets
        run: |
          mkdir -p results
          set +e
          ./gitleaks git --redact --no-banner --report-format json \
            --report-path results/secret-scan.json .
          code=$?
          leaks=$(python3 -c "import json; print(len(json.load(open('results/secret-scan.json'))))" 2>/dev/null)
          commits=$(git rev-list --count HEAD)
          python3 scripts/ci/record.py secret-scan "$code" --title "Secret scan" \
            --control "SOC 2 CC6.1" --control "ISO 27001 A.8.12" \
            --tool "gitleaks ${GITLEAKS_VERSION}" \
            --detail "${leaks:-unknown} leaks in ${commits} commits (values redacted)"
          exit "$code"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: result-secret-scan
          path: results/
          retention-days: 7

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Check the lockfile and audit dependencies
        run: |
          mkdir -p results
          set +e
          uv lock --check
          lock=$?
          uv export --frozen --all-groups --no-emit-project --format requirements-txt -o requirements.txt
          uvx "pip-audit@${PIP_AUDIT_VERSION}" -r requirements.txt --require-hashes --disable-pip \
            --format json -o results/dependency-audit.json
          code=$?
          [ "$code" -eq 0 ] && code=$lock
          summary=$(python3 -c "
          import json
          r = json.load(open('results/dependency-audit.json'))
          deps = r['dependencies']
          vulns = sum(len(d.get('vulns', [])) for d in deps)
          print(f'{vulns} known vulnerabilities in {len(deps)} locked packages')
          " 2>/dev/null)
          [ "$lock" -ne 0 ] && summary="uv.lock is out of date. ${summary}"
          python3 scripts/ci/record.py dependency-audit "$code" --title "Dependency audit" \
            --control "SOC 2 CC7.1" --control "ISO 27001 A.8.8" \
            --tool "pip-audit ${PIP_AUDIT_VERSION}" --detail "${summary:-audit did not complete}"
          exit "$code"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: result-dependency-audit
          path: results/
          retention-days: 7

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Check workflows for security issues
        run: |
          mkdir -p results
          set +e
          uvx "zizmor@${ZIZMOR_VERSION}" --offline --format json .github/workflows > results/workflow-lint.json
          code=$?
          issues=$(python3 -c "import json; print(len(json.load(open('results/workflow-lint.json'))))" 2>/dev/null)
          python3 scripts/ci/record.py workflow-lint "$code" --title "Workflow lint" \
            --control "SOC 2 CC8.1" --control "ISO 27001 A.8.9" \
            --tool "zizmor ${ZIZMOR_VERSION}" \
            --detail "${issues:-unknown} issues (pinned actions, token permissions, injection, credential persistence)"
          exit "$code"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: result-workflow-lint
          path: results/
          retention-days: 7

  branch-rules:
    name: Branch rules
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check branch protection on the default branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set +e
          python3 scripts/ci/check_branch_rules.py --branch "$DEFAULT_BRANCH" --out results/branch-rules.json
          code=$?
          python3 scripts/ci/record.py branch-rules "$code" --title "Branch rules" \
            --control "SOC 2 CC8.1" --control "ISO 27001 A.8.32" \
            --tool "GitHub rulesets API" \
            --detail "${DEFAULT_BRANCH}: pull requests, required checks, no force pushes or deletion"
          exit "$code"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: result-branch-rules
          path: results/
          retention-days: 7


  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install Terraform and TFLint (checksums verified)
        run: scripts/ci/install_terraform.sh amd64
      - name: Format, validate, lint and scan the infrastructure
        run: |
          mkdir -p results
          code=0
          terraform fmt -check -recursive infra || code=1
          for dir in infra/bootstrap infra/main; do
            (cd "$dir" && terraform init -backend=false -input=false -lockfile=readonly > /dev/null \
              && terraform validate -no-color) || code=1
            tflint --chdir "$dir" --config "$GITHUB_WORKSPACE/infra/.tflint.hcl" --format compact || code=1
          done
          uvx "checkov@${CHECKOV_VERSION}" -d infra --config-file infra/.checkov.yaml -o json \
            > results/terraform-checkov.json || code=1
          failed=$(python3 -c "
          import json
          r = json.load(open('results/terraform-checkov.json'))
          r = r if isinstance(r, list) else [r]
          print(sum(x['summary']['failed'] for x in r))
          " 2>/dev/null)
          python3 scripts/ci/record.py terraform "$code" --title "Terraform" \
            --control "SOC 2 CC8.1" --control "ISO 27001 A.8.9" \
            --tool "terraform ${TERRAFORM_VERSION}, tflint ${TFLINT_VERSION}, checkov ${CHECKOV_VERSION}" \
            --detail "fmt, validate and lint for bootstrap and main; ${failed:-unknown} unaccepted checkov findings"
          exit "$code"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: result-terraform
          path: results/
          retention-days: 7

  terraform-plan:
    name: Terraform plan
    # Only for branches in this repository (forks get no secrets and no AWS access),
    # and only once AWS is set up (docs/aws.md). The plan role is read-only.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.AWS_CONFIGURED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # to assume the read-only plan role through OIDC
    env:
      # This repository is public, and so are its run logs. Everything that names the
      # account or the org comes from secrets, which GitHub masks in logs.
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_teardown_role_arn: ${{ secrets.TEARDOWN_ROLE_ARN }}
      TF_VAR_okta_org_url: ${{ secrets.OKTA_ORG_URL }}
      TF_VAR_okta_client_id: ${{ secrets.OKTA_CLIENT_ID }}
      TF_VAR_okta_key_id: ${{ secrets.OKTA_KEY_ID }}
      TF_VAR_slack_channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
      TF_VAR_slack_ciso_user: ${{ secrets.SLACK_CISO_USER }}
      TF_VAR_slack_channel_pdf: ${{ vars.SLACK_CHANNEL_PDF || 'false' }}
      TF_VAR_jira_base_url: ${{ secrets.JIRA_BASE_URL }}
      TF_VAR_jira_email: ${{ secrets.JIRA_EMAIL }}
      TF_VAR_jira_project: ${{ secrets.JIRA_PROJECT }}
      TF_VAR_jira_parent_type: ${{ vars.JIRA_PARENT_TYPE }}
      TF_VAR_jira_child_type: ${{ vars.JIRA_CHILD_TYPE }}
      TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Terraform (checksum verified)
        run: scripts/ci/install_terraform.sh amd64
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: uar-plan
          mask-aws-account-id: true
      - name: Plan (no lock, no writes)
        working-directory: infra/main
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}" > /dev/null
          # Plan against the image that is deployed now, so the plan shows only real changes.
          uri=$(aws lambda get-function --function-name uar-collect --query Code.ImageUri --output text 2>/dev/null || true)
          digest="${uri##*@}"
          case "$digest" in sha256:*) ;; *) digest="sha256:$(printf '0%.0s' $(seq 64))" ;; esac
          export TF_VAR_image_digest="$digest"
          set +e
          terraform plan -input=false -lock=false -no-color > plan.txt 2>&1
          code=$?
          # The full plan lists resource settings and this repository's logs are public,
          # so only the totals (or the errors) are shown. Run the plan locally for details.
          if [ "$code" -eq 0 ]; then
            summary=$(grep -E '^(Plan:|No changes)' plan.txt)
            echo "${summary:-No plan summary found}"
            { echo '### Terraform plan (infra/main)'; echo; echo "${summary:-No plan summary found}"; } >> "$GITHUB_STEP_SUMMARY"
          else
            sed -n '/Error:/,$p' plan.txt | head -40
          fi
          rm -f plan.txt
          exit "$code"

  evidence:
    name: Evidence
    needs: [tests, secret-scan, dependency-audit, workflow-lint, branch-rules, terraform]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # to sign the attestation (Sigstore)
      attestations: write # to store it on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: result-*
          path: results
      - name: Build the evidence bundle
        run: |
          set +e
          python3 scripts/ci/build_evidence.py results evidence \
            --expect tests --expect secret-scan --expect dependency-audit \
            --expect workflow-lint --expect branch-rules --expect terraform
          echo "code=$?" >> "$GITHUB_ENV"
          tar -czf "evidence-${GITHUB_SHA}.tar.gz" evidence
      - name: Sign the evidence bundle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: evidence-${{ github.sha }}.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-evidence-${{ github.sha }}
          path: evidence-${{ github.sha }}.tar.gz
          retention-days: 90
      - name: Fail if any check failed
        run: exit "${code:-1}"

  deploy:
    name: Deploy
    needs: [tests, secret-scan, dependency-audit, workflow-lint, terraform]
    # Master only, once AWS is set up, and only after someone approves the run in the
    # protected "production" environment (which holds the apply role's ARN).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04-arm # builds the arm64 Lambda image natively
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # to assume the apply role through OIDC
    env:
      # This repository is public, and so are its run logs. Everything that names the
      # account or the org comes from secrets, which GitHub masks in logs.
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_teardown_role_arn: ${{ secrets.TEARDOWN_ROLE_ARN }}
      TF_VAR_okta_org_url: ${{ secrets.OKTA_ORG_URL }}
      TF_VAR_okta_client_id: ${{ secrets.OKTA_CLIENT_ID }}
      TF_VAR_okta_key_id: ${{ secrets.OKTA_KEY_ID }}
      TF_VAR_slack_channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
      TF_VAR_slack_ciso_user: ${{ secrets.SLACK_CISO_USER }}
      TF_VAR_slack_channel_pdf: ${{ vars.SLACK_CHANNEL_PDF || 'false' }}
      TF_VAR_jira_base_url: ${{ secrets.JIRA_BASE_URL }}
      TF_VAR_jira_email: ${{ secrets.JIRA_EMAIL }}
      TF_VAR_jira_project: ${{ secrets.JIRA_PROJECT }}
      TF_VAR_jira_parent_type: ${{ vars.JIRA_PARENT_TYPE }}
      TF_VAR_jira_child_type: ${{ vars.JIRA_CHILD_TYPE }}
      TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install Terraform (checksum verified)
        run: scripts/ci/install_terraform.sh arm64
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: uar-deploy
          mask-aws-account-id: true
      - name: Make sure the image repository exists
        working-directory: infra/main
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}" > /dev/null
          set +e
          TF_VAR_image_digest="sha256:$(printf '0%.0s' $(seq 64))" terraform apply -input=false -auto-approve \
            -no-color -target=aws_ecr_repository.app -target=aws_ecr_lifecycle_policy.app > apply.txt 2>&1
          code=$?
          grep -E '^Apply complete' apply.txt || sed -n '/Error:/,$p' apply.txt | head -40
          rm -f apply.txt
          exit "$code"
      - name: Build and push the Lambda image
        run: |
          repo=$(terraform -chdir=infra/main output -raw ecr_repository_url)
          # Tags are immutable, so an image already pushed for this commit is exactly this
          # commit's image. Reuse it: that's what makes re-running a failed deploy work.
          digest=$(aws ecr describe-images --repository-name "${repo#*/}" \
            --image-ids imageTag="${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [[ "$digest" == sha256:* ]]; then
            echo "The image for this commit is already in ECR; reusing it."
          else
            aws ecr get-login-password | docker login --username AWS --password-stdin "${repo%%/*}"
            scripts/build_image.sh "${repo}:${GITHUB_SHA}"
            docker push "${repo}:${GITHUB_SHA}"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${repo}:${GITHUB_SHA}")
            digest="${digest##*@}"
          fi
          echo "TF_VAR_image_digest=${digest}" >> "$GITHUB_ENV"
      - name: Apply
        working-directory: infra/main
        run: |
          # Public logs: print the result, not every resource's settings.
          set +e
          terraform apply -input=false -auto-approve -no-color > apply.txt 2>&1
          code=$?
          grep -E '^Apply complete' apply.txt || sed -n '/Error:/,$p' apply.txt | head -40
          rm -f apply.txt
          exit "$code"
